# Gera os instaladores do Echo para computador (Mac e Windows).
# Quando roda:
#  - quando algo em desktop/ muda na main: monta e coloca os instaladores na Release "v<versão do desktop/package.json>"
#    (cria a Release se ainda não existir);
#  - ao publicar uma Release com uma tag "v1.0.1" (usa a versão da tag);
#  - manualmente em Actions → "Echo para computador" → Run workflow.
name: Echo para computador

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Programa auxiliar (som por app e controle remoto)
        shell: bash
        run: bash helper/build.sh
      - name: Instalar
        run: npm install --no-audit --no-fund
      # versão: a da tag (Release publicada à mão) ou 1.<menor do package.json>.<número da montagem> (automático)
      - name: Versão
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"
          else MINOR=$(node -p "require('./package.json').version.split('.')[1]"); V="1.$MINOR.${{ github.run_number }}"; fi
          npm version "$V" --no-git-tag-version --allow-same-version
      - name: Gerar instalador (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # no Mac, um processador de cada vez: montar os dois .dmg juntos trava o hdiutil ("Resource busy")
      - name: Gerar instalador (Mac, Apple Silicon)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for i in 1 2 3; do
            hdiutil detach /Volumes/Echo -force >/dev/null 2>&1 || true
            npx electron-builder --mac --arm64 --publish never && exit 0
            echo "tentativa $i falhou, tentando de novo"; sleep 10
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Gerar instalador (Mac, Intel)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for i in 1 2 3; do
            hdiutil detach /Volumes/Echo -force >/dev/null 2>&1 || true
            npx electron-builder --mac --x64 --publish never && exit 0
            echo "tentativa $i falhou, tentando de novo"; sleep 10
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Nome da versão
        id: v
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Echo-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

  # um job só cria a Release e sobe tudo (os dois sistemas juntos), para não brigarem criando a mesma Release
  publicar:
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Nome da versão
        id: v
        shell: bash
        run: |
          F=$(ls out/Echo-*-win-x64.exe | head -1); V=$(basename "$F" | sed -E 's/^Echo-(.*)-win-x64\.exe$/\1/')
          echo "tag=v$V" >> "$GITHUB_OUTPUT"; ls -la out
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Echo ${{ steps.v.outputs.tag }}
          make_latest: true
          files: out/*
