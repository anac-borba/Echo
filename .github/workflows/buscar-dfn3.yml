# Ferramenta: compila o DeepFilterNet3 (libDF, MIT/Apache-2.0) para WebAssembly a partir do código original
# (github.com/Rikorose/DeepFilterNet) e guarda o resultado numa branch, para ser revisado e copiado para web/js/vendor/.
# Roda só quando esta branch recebe um push.
name: Compilar DeepFilterNet3
on:
  push:
    branches: [ferramentas]
permissions:
  contents: write
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Rikorose/DeepFilterNet
          path: df
      - name: Compilar
        shell: bash
        run: |
          set +e
          W="$GITHUB_WORKSPACE/vendor-dfn3"; rm -rf "$W"; mkdir -p "$W"; L="$W/LOG.txt"
          (cd df && git log -1 --format='%H %cd' >>"$L")
          rustup target add wasm32-unknown-unknown >>"$L" 2>&1
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh >>"$L" 2>&1
          grep -n "wasm" df/libDF/Cargo.toml >>"$L" 2>&1
          (cd df/libDF && wasm-pack build --release --target web --out-dir "$W/pkg" --features wasm) >>"$L" 2>&1
          echo "exit $?" >>"$L"
          cp df/models/DeepFilterNet3_onnx.tar.gz "$W/model.tar.gz" >>"$L" 2>&1
          cp df/LICENSE* "$W/" 2>/dev/null
          ls -la "$W" "$W/pkg" >>"$L" 2>&1
          exit 0
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f vendor-dfn3
          git commit -m "DeepFilterNet3 compilado para revisão [skip ci]" || exit 0
          git push origin HEAD:ferramentas-resultado --force
