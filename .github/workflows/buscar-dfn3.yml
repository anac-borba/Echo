# Ferramenta: baixa o pacote do DeepFilterNet3 (MIT/Apache-2.0) do npm e guarda numa branch,
# para ser revisado e copiado para web/js/vendor/. Roda só quando esta branch recebe um push.
name: Buscar DeepFilterNet3
on:
  push:
    branches: [ferramentas]
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Baixar
        run: |
          mkdir -p /tmp/p && cd /tmp/p
          npm pack deepfilternet3-noise-filter@1.3.0
          tar -xzf deepfilternet3-noise-filter-1.3.0.tgz
          rm -rf "$GITHUB_WORKSPACE/vendor-dfn3" && mkdir -p "$GITHUB_WORKSPACE/vendor-dfn3"
          cp -r package/. "$GITHUB_WORKSPACE/vendor-dfn3/"
          cd "$GITHUB_WORKSPACE/vendor-dfn3" && find . -type f | sort > ARQUIVOS.txt && du -ah . | sort -h | tail -20 > TAMANHOS.txt
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vendor-dfn3
          git commit -m "DeepFilterNet3: pacote do npm para revisão [skip ci]" || exit 0
          git push origin HEAD:ferramentas-resultado --force
