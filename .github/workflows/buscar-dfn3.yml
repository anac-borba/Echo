# Ferramenta: baixa o pacote do DeepFilterNet3 (MIT/Apache-2.0) do npm e guarda numa branch,
# para ser revisado e copiado para web/js/vendor/. Roda só quando esta branch recebe um push.
name: Buscar DeepFilterNet3
on:
  push:
    branches: [ferramentas]
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Baixar
        shell: bash
        run: |
          set +e
          W="$GITHUB_WORKSPACE/vendor-dfn3"; rm -rf "$W"; mkdir -p "$W/assets"; L="$W/LOG.txt"
          cd /tmp && npm pack deepfilternet3-noise-filter@1.3.0 >>"$L" 2>&1 && tar -xzf deepfilternet3-noise-filter-1.3.0.tgz && cp -r package/. "$W/"
          B=https://cdn.mezon.ai/AI/models/datas/noise_suppression/deepfilternet3/v3
          for f in pkg/df_bg.wasm pkg/df.js models/DeepFilterNet3_onnx.tar.gz; do
            echo "== $B/$f" >>"$L"; curl -sSL -A "Mozilla/5.0" -o "$W/assets/$(basename $f)" -w "%{http_code} %{size_download}\n" "$B/$f" >>"$L" 2>&1
          done
          echo "== github model" >>"$L"
          curl -sSL -o "$W/assets/DeepFilterNet3_onnx.github.tar.gz" -w "%{http_code} %{size_download}\n" https://github.com/Rikorose/DeepFilterNet/raw/main/models/DeepFilterNet3_onnx.tar.gz >>"$L" 2>&1
          cd "$W" && sha256sum assets/* >> "$L"; ls -la assets >> "$L"
          exit 0
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vendor-dfn3
          git commit -m "DeepFilterNet3: pacote do npm para revisão [skip ci]" || exit 0
          git push origin HEAD:ferramentas-resultado --force
