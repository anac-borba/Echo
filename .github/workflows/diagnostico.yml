# Ferramenta: compila o programa auxiliar e guarda o registro numa branch (para achar erros).
name: Diagnostico do app
on:
  push:
    branches: [diagnostico]
permissions:
  contents: write
jobs:
  montar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Compilar com registro
        shell: bash
        run: |
          set +e
          L="$GITHUB_WORKSPACE/log-${{ runner.os }}.txt"
          { bash desktop/helper/build.sh 2>&1; echo "== exit helper $?"; } > "$L"; cat "$L"
          if [ "$RUNNER_OS" = macOS ]; then { (printf 'ping\nlist\n'; sleep 3; printf 'quit\n') | desktop/helper/bin/echo-helper | strings; } >> "$L" 2>&1; fi
          if [ "$RUNNER_OS" = Windows ]; then { (printf 'ping\nlist\n'; sleep 3; printf 'quit\n') | desktop/helper/bin/echo-helper.exe | strings; } >> "$L" 2>&1; fi
          exit 0
      - name: Guardar registro
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp "log-${{ runner.os }}.txt" /tmp/l.txt
          git checkout -q --orphan r && git rm -rqf --cached . && git clean -fdxq
          cp /tmp/l.txt "log-${{ runner.os }}.txt" && git add "log-${{ runner.os }}.txt" && git commit -qm "registro ${{ runner.os }} [skip ci]"
          git push -f origin "r:diagnostico-${{ runner.os }}"
