# Ferramenta: roda a mesma montagem do app e guarda o registro completo numa branch (para achar erros).
name: Diagnostico do app
on:
  push:
    branches: [diagnostico]
permissions:
  contents: write
jobs:
  montar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Montar com registro
        shell: bash
        working-directory: desktop
        run: |
          set +e
          L="$GITHUB_WORKSPACE/log-${{ runner.os }}.txt"
          { echo "== node $(node -v) npm $(npm -v)"; npm install --no-audit --no-fund 2>&1; echo "== exit install $?";
            if [ "$RUNNER_OS" = macOS ]; then
              for a in arm64 x64; do for i in 1 2 3; do hdiutil detach /Volumes/Echo -force >/dev/null 2>&1; CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --$a --publish never 2>&1 && { echo "== ok $a"; break; }; echo "== falhou $a $i"; sleep 10; done; done
            else CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --win --publish never 2>&1; echo "== exit build $?"; fi
            ls -la dist 2>&1; } > "$L"
          exit 0
      - name: Guardar registro
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp "log-${{ runner.os }}.txt" /tmp/l.txt
          git checkout -q --orphan r && git rm -rqf --cached . && git clean -fdxq
          cp /tmp/l.txt "log-${{ runner.os }}.txt" && git add "log-${{ runner.os }}.txt" && git commit -qm "registro ${{ runner.os }} [skip ci]"
          git push -f origin "r:diagnostico-${{ runner.os }}"
